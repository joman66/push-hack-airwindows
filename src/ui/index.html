<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airwindows</title>
<style>
  :root { --bg:#141414; --panel:#1f1f1f; --line:#333; --text:#e8e8e8; --dim:#8a8a8a; --accent:#ff8a1f; --ok:#3ccf6e; --bad:#ff4d4d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 -apple-system, system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:14px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; letter-spacing:.04em; }
  h1 span { color:var(--accent); }
  .meter { width:120px; height:8px; background:#2a2a2a; border-radius:4px; overflow:hidden; display:inline-block; vertical-align:middle; }
  .meter i { display:block; height:100%; background:var(--ok); width:0; transition:width .2s; }
  .stat { color:var(--dim); font-size:13px; }
  #msg { margin:12px 20px 0; padding:10px 14px; border-radius:6px; background:#3a1d1d; color:#ffb3b3; display:none; }
  main { padding:16px 20px 40px; }
  .flow { color:var(--dim); margin:4px 0 12px; font-size:13px; }
  .slot { background:var(--panel); border:1px solid var(--line); border-radius:8px; margin-bottom:12px; }
  .slot.off { opacity:.55; }
  .slot-head { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .num { color:var(--accent); font-weight:600; width:20px; }
  .name { font-weight:600; font-size:15px; }
  .cat { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
  .what { color:var(--dim); font-size:12px; flex-basis:100%; padding-left:30px; }
  .spacer { flex:1; }
  button, select { background:#2b2b2b; color:var(--text); border:1px solid #444; border-radius:5px; padding:5px 10px; font:inherit; cursor:pointer; }
  button:hover { border-color:#666; }
  button.on { color:var(--ok); } button.byp { color:var(--bad); }
  button.danger:hover { border-color:var(--bad); color:var(--bad); }
  .params { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:10px 18px; padding:12px 14px; }
  .param label { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); }
  .param label b { color:var(--text); font-weight:500; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  .add { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .gains { display:flex; gap:24px; margin:0 0 16px; flex-wrap:wrap; }
  .gains .param { width:240px; }
  .empty { color:var(--dim); padding:20px; border:1px dashed var(--line); border-radius:8px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1><span>AIR</span>WINDOWS</h1>
  <span class="stat">IN <span class="meter"><i id="mIn"></i></span></span>
  <span class="stat">OUT <span class="meter"><i id="mOut"></i></span></span>
  <span class="stat" id="dsp"></span>
  <span class="stat" id="bus"></span>
</header>
<div id="msg"></div>
<main>
  <div class="gains">
    <div class="param"><label>Input gain <b id="giv"></b></label><input id="gi" type="range" min="0" max="2" step="0.01"></div>
    <div class="param"><label>Output gain <b id="gov"></b></label><input id="go" type="range" min="0" max="2" step="0.01"></div>
  </div>
  <div class="flow">Live track &rarr; Link input &rarr; effects in order &rarr; Link channel "Airwindows" &rarr; Live</div>
  <div id="chain"></div>
  <div class="add">
    <select id="pick"></select>
    <button id="addBtn">Add to chain</button>
    <span class="stat" id="pickWhat"></span>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let effects = [], byName = {}, state = null, dragging = false, lastVersion = -1;

async function api(path, body) {
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const db = (g) => g <= 0.00001 ? '-inf dB' : (20*Math.log10(g) >= 0 ? '+' : '') + (20*Math.log10(g)).toFixed(1) + ' dB';
const meter = (p) => p <= 0.001 ? 0 : Math.max(0, Math.min(100, (20*Math.log10(p)+60)/60*100));
function flash(t) { const m = $('msg'); m.textContent = t; m.style.display = t ? 'block' : 'none'; }

async function loadEffects() {
  const j = await api('/api/effects');
  effects = j.effects;
  const sel = $('pick');
  sel.innerHTML = '';
  for (const c of j.categories) {
    const g = document.createElement('optgroup'); g.label = c;
    for (const e of effects.filter(e => e.category === c)) {
      byName[e.name] = e;
      const o = document.createElement('option'); o.value = e.name; o.textContent = e.name; g.appendChild(o);
    }
    sel.appendChild(g);
  }
  sel.onchange = () => { const e = byName[sel.value]; $('pickWhat').textContent = e ? e.what : ''; };
  sel.onchange();
}

function replaceSelect(cur) {
  const s = document.createElement('select');
  const o0 = document.createElement('option'); o0.textContent = 'Replace with...'; o0.value = ''; s.appendChild(o0);
  let g = null, cat = '';
  for (const e of effects) {
    if (e.category !== cat) { cat = e.category; g = document.createElement('optgroup'); g.label = cat; s.appendChild(g); }
    const o = document.createElement('option'); o.value = e.name; o.textContent = e.name; if (e.name === cur) o.disabled = true; g.appendChild(o);
  }
  return s;
}

function render() {
  const a = state.audio;
  $('mIn').style.width = meter(a.peak_in) + '%';
  $('mOut').style.width = meter(a.peak_out) + '%';
  $('dsp').textContent = 'DSP ' + Math.round(a.dsp_load*100) + '%';
  $('bus').textContent = a.connected ? (a.routed ? 'input routed' : 'no input') : 'no audio bus';
  flash(state.message ? state.message + (a.connected && !a.routed ? ' (on the Audio Loopback page: Routing)' : '') : '');
  if (!dragging) {
    $('gi').value = state.in_gain; $('giv').textContent = db(state.in_gain);
    $('go').value = state.out_gain; $('gov').textContent = db(state.out_gain);
  }
  if (state.version === lastVersion || dragging) return;
  lastVersion = state.version;
  $('addBtn').disabled = state.slots.length >= state.max_slots;

  const root = $('chain'); root.innerHTML = '';
  if (!state.slots.length) { root.innerHTML = '<div class="empty">The chain is empty. Pick an effect below, or press Add on Push.</div>'; }
  state.slots.forEach((s, i) => {
    const el = document.createElement('div'); el.className = 'slot' + (s.bypass ? ' off' : '');
    const head = document.createElement('div'); head.className = 'slot-head';
    head.innerHTML = `<span class="num">${i+1}</span><span class="name"></span><span class="cat"></span><span class="spacer"></span>`;
    head.querySelector('.name').textContent = s.name;
    head.querySelector('.cat').textContent = s.category;
    const btn = (label, cls, fn, dis) => { const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls; b.disabled = !!dis; b.onclick = fn; head.appendChild(b); };
    btn(s.bypass ? 'Bypassed' : 'On', s.bypass ? 'byp' : 'on', () => op({op:'bypass', pos:i, bypass:!s.bypass}));
    btn('↑', '', () => op({op:'move', pos:i, to:i-1}), i === 0);
    btn('↓', '', () => op({op:'move', pos:i, to:i+1}), i === state.slots.length-1);
    const rs = replaceSelect(s.name); rs.onchange = () => rs.value && op({op:'replace', pos:i, name:rs.value}); head.appendChild(rs);
    btn('Remove', 'danger', () => op({op:'remove', pos:i}));
    const what = document.createElement('div'); what.className = 'what'; what.textContent = s.what; head.appendChild(what);
    el.appendChild(head);

    const ps = document.createElement('div'); ps.className = 'params';
    s.params.forEach((p, k) => {
      const d = document.createElement('div'); d.className = 'param';
      d.innerHTML = '<label><span></span><b></b></label><input type="range" min="0" max="1" step="0.001">';
      d.querySelector('span').textContent = p.name;
      const val = d.querySelector('b'); val.textContent = p.display;
      const r = d.querySelector('input'); r.value = p.value; r.title = 'Double-click: back to default';
      r.oninput = async () => {
        dragging = true;
        try { const j = await api('/api/param', {pos:i, index:k, value:parseFloat(r.value)}); val.textContent = j.params[k].display; } catch (e) { flash(e.message); }
      };
      r.onchange = () => { dragging = false; };
      r.ondblclick = async () => { const j = await api('/api/param', {pos:i, index:k, reset:true}); r.value = j.params[k].value; val.textContent = j.params[k].display; };
      ps.appendChild(d);
    });
    el.appendChild(ps);
    root.appendChild(el);
  });
}

async function op(body) {
  try { state = await api('/api/chain', body); lastVersion = -1; render(); } catch (e) { flash(e.message); }
}
async function gains() {
  dragging = true;
  $('giv').textContent = db(parseFloat($('gi').value)); $('gov').textContent = db(parseFloat($('go').value));
  state = await api('/api/gains', {in_gain:parseFloat($('gi').value), out_gain:parseFloat($('go').value)});
}
$('gi').oninput = gains; $('go').oninput = gains;
$('gi').onchange = $('go').onchange = () => { dragging = false; };
$('addBtn').onclick = () => op({op:'insert', pos:-1, name:$('pick').value});

async function poll() {
  try { state = await api('/api/state'); render(); } catch (e) { flash('Airwindows is not answering: ' + e.message); }
  setTimeout(poll, 1000);
}
loadEffects().then(poll);
</script>
</body>
</html>
